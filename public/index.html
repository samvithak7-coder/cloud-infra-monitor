<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Infrastructure & Log Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 2rem;
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #38bdf8;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .card {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #334155;
            text-align: center;
        }

        .card h3 {
            margin: 0;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .card p {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 0.5rem 0 0 0;
            color: #4ade80;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: #166534;
            color: #4ade80;
            font-weight: bold;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 2rem;
        }

        button:hover {
            background: #0369a1;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Cloud Infrastructure & Log Monitor</h1>
        <div style="text-align: center;">
            <span class="status-badge" id="system-status">Checking System...</span>
        </div>

        <div class="grid">
            <div class="card">
                <h3>CPU USAGE</h3>
                <p id="cpu">- %</p>
            </div>
            <div class="card">
                <h3>MEMORY USAGE</h3>
                <p id="memory">- %</p>
            </div>
            <div class="card">
                <h3>LATENCY</h3>
                <p id="latency">- ms</p>
            </div>
            <div class="card">
                <h3>ACTIVE NODES</h3>
                <p id="nodes">-</p>
            </div>
        </div>

        <div style="text-align: center;">
            <button onclick="fetchMetrics()">Refresh Metrics</button>
        </div>
    </div>

    <script>
        async function fetchMetrics() {
            try {
                const res = await fetch('/api/monitor');
                const data = await res.json();
                document.getElementById('system-status').innerText = 'SYSTEM: ' + data.status.toUpperCase();
                document.getElementById('cpu').innerText = data.cpu_usage_percent + '%';
                document.getElementById('memory').innerText = data.memory_usage_percent + '%';
                document.getElementById('latency').innerText = data.latency_ms + ' ms';
                document.getElementById('nodes').innerText = data.active_nodes;
            } catch (err) {
                document.getElementById('system-status').innerText = 'SYSTEM ERROR';
                document.getElementById('system-status').style.background = '#991b1b';
                document.getElementById('system-status').style.color = '#f87171';
            }
        }
        fetchMetrics();
        setInterval(fetchMetrics, 5000);
    </script>
</body>

</html>
